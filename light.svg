  </circle>
  <rect width="1180" height="610" rx="24" ry="24" filter="url(#noise)" opacity="0.3"/>
  <rect x="1" y="1" width="1178" height="608" rx="23" ry="23" fill="none" stroke="rgba(15,23,42,0.08)" stroke-width="1"/>
