<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle top line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" opacity="0.9"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="320" fill="url(#accent)"/>

  <!-- Main content -->
  <text x="60" y="110" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC">
    Adnan Raza
  </text>
  
  <text x="60" y="155" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="url(#textGrad)">
    AI Engineer
  </text>

  <text x="60" y="200" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#94A3B8">
    Building practical AI systems and data-driven solutions
  </text>

  <!-- Bottom skills pills -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13">
    <rect x="60" y="240" width="70" height="28" rx="14" fill="rgba(59,130,246,0.15)" stroke="#3B82F6" stroke-width="1"/>
    <text x="95" y="259" text-anchor="middle" fill="#93C5FD">Python</text>

    <rect x="142" y="240" width="95" height="28" rx="14" fill="rgba(6,182,212,0.12)" stroke="#06B6D4" stroke-width="1"/>
    <text x="189.5" y="259" text-anchor="middle" fill="#67E8F9">Scikit-learn</text>

    <rect x="249" y="240" width="70" height="28" rx="14" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="1"/>
    <text x="284" y="259" text-anchor="middle" fill="#6EE7B7">Pandas</text>

    <rect x="331" y="240" width="60" height="28" rx="14" fill="rgba(59,130,246,0.15)" stroke="#3B82F6" stroke-width="1"/>
    <text x="361" y="259" text-anchor="middle" fill="#93C5FD">SQL</text>

    <rect x="403" y="240" width="95" height="28" rx="14" fill="rgba(6,182,212,0.12)" stroke="#06B6D4" stroke-width="1"/>
    <text x="450.5" y="259" text-anchor="middle" fill="#67E8F9">Data Science</text>
  </g>

  <!-- Right side subtle info -->
  <text x="1140" y="280" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">
    Pakistan · 6+ years experience
  </text>
</svg>